# ==========================================
# MAIN SHELL CONFIG
# ==========================================

[shell]
# Whether to show the welcome greeting message on startup
show_greeting = true
# Add an empty line before each prompt for better readability
add_newline_before_prompt = false
# Enable or disable syntax highlighting for the command line input
syntax_highlighting = true

[startup]
commands = [
    "clear",
    "echo 'Welcome to crush shell!'"
]

[env]
EDITOR = "nano"
VISUAL = "nano"
LANG = "en_US.UTF-8"
PATH = [
    "~/.local/bin",
    "~/bin"
]

[aliases]
ll = "ls -al"
la = "ls -a"
g = "git"

# Quick Aliases
c = "clear"
q = "exit"

[bindings]
# Available actions for key bindings:
# - "clear_screen"   : Clears the terminal screen
# - "search_history" : Opens reverse history search
# - "exit_shell"     : Exits crush shell
# - "accept_line"    : Equivalent to pressing Enter
# - "move_home"      : Move cursor to the beginning of the line
# - "move_end"       : Move cursor to the end of the line
# - "complete_hint"  : Accept inline autocomplete hint
# - "complete_list"  : Show completion suggestions list
# - "execute: <cmd>" : Immediately inject and run a command

"Ctrl+L" = "clear_screen"
"Ctrl+R" = "search_history"
"Ctrl+D" = "exit_shell"

# execute command y for yazi wrapper
"Ctrl+T" = "execute: y"

[completion]
case_sensitive = false
fuzzy_search = true
inline_suggestions = true

[dir_aliases]
# work if user exec cd ~config, nvim ~config/crush.toml, and other command
config = "~/.config/crush"
dl = "~/Downloads"
doc = "~/Documents"
pic = "~/Pictures"

[hooks]
# Auto after command run
on_cd = "ls"

# Auto before command run
pre_command = ""
on_clear = ""

[history]
max_entries = 10000
ignore_space = true
ignore_dups = true
timestamp_format = "%Y-%m-%d %H:%M:%S"

[theme]
# for valid command (executeable/builtin)
command_valid = "green"
# for incalid command (typo)
command_invalid = "red"
# for string or path
string = "yellow"

# ==========================================
# WRAPPER CONFIG
# ==========================================

[functions.y]
description = "Yazi wrapper to change directory on exit"
body = """
let tmp = $(mktemp -t "yazi-cwd.XXXXXX")
yazi $args --cwd-file="$tmp"
let cwd = $(cat "$tmp")
if [ -n "$cwd" ]
    if [ "$cwd" != "$PWD" ]
        cd "$cwd"
    end
end
rm -f -- "$tmp"
"""

[functions.start_niri]
description = "Jalankan Niri HANYA jika berada di TTY murni"
body = """
if [ -z "$WAYLAND_DISPLAY" ]
    niri
else
    echo "Peringatan: Niri sudah berjalan!"
end
"""

# ==========================================
# CRUSH BUILT-IN PROMPT ENGINE (Starship-like)
# ==========================================

[prompt]
# Format utama penyusun prompt
format = """
$cmd_duration $directory$git_branch
  $character"""

[prompt.character]
success_symbol = "[  ](bold fg:243)"
error_symbol = "[  ](bold fg:244)"

[prompt.directory]
home_symbol = " "
read_only = "  "
style = "bg:255 fg:240"
truncation_length = 2
truncation_symbol = ".../"
format = "[](bold fg:255)[󰉋 → $path]($style)[](bold fg:255)"

[prompt.directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[prompt.cmd_duration]
min_time = 0
format = "[](bold fg:252)[󰪢 $duration](bold bg:252 fg:235)[](bold fg:252)"

[prompt.git_branch]
style = "bg: 252"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:252)[$symbol $branch(:$remote_branch)](fg:235 bg:252)[ ](bold fg:252)"

[prompt.git_commit]
commit_hash_length = 4
tag_symbol = " "

[prompt.git_state]
format = "[\\($state( $progress_current of $progress_total)\\)]($style) "
cherry_pick = "[🍒 PICKING](bold red)"

[prompt.git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = "[++\\($count\\)](green)"
renamed = " ✍️ "
deleted = " 🗑 "

[prompt.hostname]
ssh_only = false
format = "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = false

[prompt.username]
style_user = "bold bg:252 fg:235"
style_root = "red bold"
format = "[](bold fg:252)[$user]($style)"
disabled = false
show_always = true
